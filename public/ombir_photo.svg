<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2952"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0ac69"/>
      <stop offset="100%" stop-color="#c68642"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#475569" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- Office Background Wall -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Window Frame on Left -->
  <rect x="10" y="10" width="80" height="260" rx="4" fill="#334155" opacity="0.6"/>
  <line x1="50" y1="10" x2="50" y2="270" stroke="#1e293b" stroke-width="3"/>
  <line x1="10" y1="130" x2="90" y2="130" stroke="#1e293b" stroke-width="3"/>
  <rect x="15" y="15" width="32" height="110" fill="#38bdf8" opacity="0.15"/>
  <rect x="53" y="15" width="32" height="110" fill="#38bdf8" opacity="0.15"/>

  <!-- Framed Quote Poster on Right "FOCUS DISCIPLINE SUCCESS" -->
  <rect x="290" y="25" width="95" height="130" rx="3" fill="#090d16" stroke="#f8fafc" stroke-width="4"/>
  <text x="337" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1">FOCUS</text>
  <text x="337" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="9" text-anchor="middle" letter-spacing="0.5">DISCIPLINE</text>
  <text x="337" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="9" text-anchor="middle" letter-spacing="0.5">SUCCESS</text>
  <line x1="310" y1="110" x2="365" y2="110" stroke="#64748b" stroke-width="1.5"/>

  <!-- Trophy on shelf on right -->
  <path d="M 368,180 L 378,180 L 376,200 L 370,200 Z" fill="#fbbf24"/>
  <path d="M 370,170 Q 373,160 373,150 Q 373,140 370,135 L 376,135 Q 373,140 373,150 Q 373,160 376,170 Z" fill="#f59e0b"/>

  <!-- Wood Desk at bottom -->
  <path d="M 0,290 L 400,290 L 400,400 L 0,400 Z" fill="url(#deskGrad)"/>
  <line x1="0" y1="292" x2="400" y2="292" stroke="#9a3412" stroke-width="2"/>

  <!-- Laptop on Left Desk -->
  <polygon points="10,270 110,270 130,305 0,305" fill="#cbd5e1"/>
  <polygon points="10,270 110,270 100,190 20,190" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <polygon points="15,265 105,265 96,195 24,195" fill="#0284c7" opacity="0.3"/>
  <!-- Apple Logo shape indicator -->
  <circle cx="60" cy="230" r="5" fill="#f8fafc" opacity="0.8"/>

  <!-- Mug on Right Desk "FOCUS" -->
  <rect x="330" y="270" width="28" height="35" rx="3" fill="#1e293b"/>
  <path d="M 358,278 Q 366,288 358,298" fill="none" stroke="#1e293b" stroke-width="3"/>
  <text x="344" y="288" fill="#f8fafc" font-family="sans-serif" font-weight="800" font-size="5" text-anchor="middle">FOCUS</text>

  <!-- Ombir Yadav - Body & Shoulders -->
  <!-- Dark Navy Blazer -->
  <path d="M 100,400 Q 120,280 160,250 Q 200,240 240,250 Q 280,280 300,400 Z" fill="url(#suitGrad)"/>

  <!-- Suit Lapels -->
  <path d="M 160,250 L 190,330 L 165,370 L 130,330 Z" fill="#0f172a"/>
  <path d="M 240,250 L 210,330 L 235,370 L 270,330 Z" fill="#0f172a"/>

  <!-- Black Open Shirt & Collar -->
  <polygon points="180,250 220,250 215,340 185,340" fill="#090d16"/>
  <polygon points="175,250 190,275 198,250" fill="#1e293b"/>
  <polygon points="225,250 210,275 202,250" fill="#1e293b"/>

  <!-- Gold Neck Chain -->
  <path d="M 188,270 Q 200,285 212,270" fill="none" stroke="#fbbf24" stroke-width="2"/>

  <!-- Neck -->
  <rect x="186" y="210" width="28" height="45" rx="4" fill="url(#skinGrad)"/>
  <!-- Neck shadow -->
  <path d="M 186,230 Q 200,245 214,230 L 214,245 L 186,245 Z" fill="#b45309" opacity="0.3"/>

  <!-- Head / Face -->
  <path d="M 170,160 Q 170,120 200,115 Q 230,120 230,160 Q 230,215 200,225 Q 170,215 170,160 Z" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="168" cy="170" rx="5" ry="10" fill="#c68642"/>
  <ellipse cx="232" cy="170" rx="5" ry="10" fill="#c68642"/>

  <!-- Styled Spiky Black Hair -->
  <path d="M 165,155 C 160,125 175,95 200,95 C 225,95 240,125 235,155 C 230,120 215,100 200,102 C 185,100 170,120 165,155 Z" fill="#090d16"/>
  <path d="M 175,115 Q 185,85 205,90 Q 220,88 225,110 Q 210,95 195,100 Z" fill="#1e293b"/>

  <!-- Eyebrows behind glasses -->
  <path d="M 176,150 Q 186,145 194,149" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <path d="M 206,149 Q 214,145 224,150" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

  <!-- Aviator Sunglasses -->
  <!-- Left Lens -->
  <path d="M 173,158 Q 173,152 186,152 Q 197,152 197,158 Q 197,178 185,182 Q 173,178 173,158 Z" fill="url(#lensGrad)" stroke="url(#frameGrad)" stroke-width="2.5"/>
  <!-- Right Lens -->
  <path d="M 203,158 Q 203,152 214,152 Q 227,152 227,158 Q 227,178 215,182 Q 203,178 203,158 Z" fill="url(#lensGrad)" stroke="url(#frameGrad)" stroke-width="2.5"/>
  <!-- Double Bridge -->
  <line x1="197" y1="154" x2="203" y2="154" stroke="url(#frameGrad)" stroke-width="2.5"/>
  <line x1="195" y1="158" x2="205" y2="158" stroke="url(#frameGrad)" stroke-width="2"/>
  <!-- Glasses Glare -->
  <path d="M 176,155 L 186,155 L 180,175 Z" fill="#ffffff" opacity="0.35"/>
  <path d="M 206,155 L 216,155 L 210,175 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Nose & Mouth -->
  <path d="M 197,180 Q 200,192 203,180" fill="none" stroke="#9a3412" stroke-width="1.5"/>
  <path d="M 188,202 Q 200,207 212,202" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Subtle Stubble / Beard -->
  <path d="M 180,200 Q 200,222 220,200" fill="none" stroke="#451a03" stroke-width="1" opacity="0.4" stroke-dasharray="1 2"/>
</svg>
